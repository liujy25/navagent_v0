[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navagent-v0"
version = "0.1.0"
description = "Robot-facing canonical NavClaw visual language navigation agent"
requires-python = ">=3.9"
dependencies = [
  "flask>=3.0",
  "numba>=0.58",
  "numpy>=1.24",
  "openai>=1.0",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "requests>=2.31",
  "scikit-image>=0.21",
  "scipy>=1.10",
  "torch>=2.1",
  "ultralytics>=8.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
navagent-vln = "navclaw.runners.robot_vln_runner:main"

[tool.setuptools.packages.find]
include = ["frontier_exploration*", "navclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
